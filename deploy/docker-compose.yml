services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ""
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped