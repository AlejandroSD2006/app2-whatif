[project]
name = "app2-whatif-backend"
version = "0.1.0"
description = "API de historia alternativa"
requires-python = ">=3.12,<3.13"
dependencies = [
    "clerk-backend-api==7.0.0",
    "fastapi==0.143.0",
    "openrouter==1.3.43",
    "pydantic==2.12.5",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]